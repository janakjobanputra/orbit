name: Orbit
options:
  bundleIdPrefix: com.janakjobanputra
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.1.4"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: Y82QXWVLD9
    CODE_SIGN_STYLE: Automatic

targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - Orbit
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Orbit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.janakjobanputra.Orbit
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Orbit/Orbit.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Lets the sandboxed app talk to Sparkle's installer, which runs outside the sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
  OrbitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OrbitTests
    dependencies:
      - target: Orbit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
